source.topic.list=1001.flexi-mc-uat-qa.flexi-gonogo.loanCharges,1001.flexi-mc-uat-qa.flexi-gonogo.dmDetails,1001.asset_item
destination.topic.list=target1,target2,target3

source.topic.loanCharges.event.type=CDC
source.topic.loanCharges.key.field=s_application_id
source.topic.loanCharges.destination.topic=1001_target
source.topic.loanCharges.mapping.field.list=s_application_id,ts_ms,s_api_fees,s_institution_id
source.topic.loanCharges.mapping.field.s_application_id=$.after._id
source.topic.loanCharges.mapping.field.ts_ms=$.source.ts_ms
#source.topic.loanCharges.mapping.field.s_api_fees=$.after.feesDetails[0].fee
source.topic.loanCharges.mapping.field.s_institution_id=$.after.institutionId
source.topic.loanCharges.mapping.field.s_institution_id.source.datatype=string
source.topic.loanCharges.mapping.field.s_institution_id.destination.datatype=int
source.topic.loanCharges.mapping.field.s_api_fees=$.after.feesDetails[?(@.feeType=='API charges'||@.feeType=='API CHARGES'||@.feeType=='apicharges'||@.feeType=='apiCharges')].fee
source.topic.loanCharges.mapping.field.s_api_fees.isconditional=true
source.topic.loanCharges.mapping.field.s_api_fees.source.datatype=string
source.topic.loanCharges.mapping.field.s_api_fees.destination.datatype=double

source.topic.dmDetails.event.type=CDC
source.topic.dmDetails.key.field=s_application_id
source.topic.dmDetails.destination.topic=2002_target
source.topic.dmDetails.mapping.field.list=s_application_id,ts_ms
source.topic.dmDetails.mapping.field.s_application_id=$.after._id
source.topic.dmDetails.mapping.field.s_application_id.source.datatype=string
source.topic.dmDetails.mapping.field.s_application_id.destination.datatype=int
source.topic.dmDetails.mapping.field.ts_ms=$.source.ts_ms

source.topic.asset_item.event.type=DE
source.topic.asset_item.key.field=s_application_id
source.topic.asset_item.destination.topic=1001_target
source.topic.asset_item.mapping.field.list=s_application_id,s_collateral_id,ts_ms,s_asset_created_datetime,s_date_of_lien
source.topic.asset_item.mapping.field.s_application_id=$.data.app_loan_mapping[0].application_id
source.topic.asset_item.mapping.field.ts_ms=$.created_on
source.topic.asset_item.mapping.field.s_collateral_id=$.data.id
source.topic.asset_item.mapping.field.s_asset_created_datetime=$.data.asset_created_datetime
source.topic.asset_item.mapping.field.s_asset_created_datetime.source.datatype=string_utc_date
source.topic.asset_item.mapping.field.s_asset_created_datetime.destination.datatype=epoch
source.topic.asset_item.mapping.field.s_date_of_lien=$.data.date_of_lien
source.topic.asset_item.mapping.field.s_date_of_lien.source.datatype=string_iso_date
source.topic.asset_item.mapping.field.s_date_of_lien.destination.datatype=epoch
